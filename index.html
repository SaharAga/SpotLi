<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/png" href="/icons/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Deliveree - Modern, smart parcel and shipment tracking dashboard with auto carrier detection and live timelines." />
    
    <!-- Apply the right theme before first paint — defaults to the OS/browser preference, not a hardcoded value -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('deliveree_theme') || 'system';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'system' ? prefersDark : stored === 'dark';
          document.documentElement.classList.add(isDark ? 'dark' : 'light');
        } catch {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- Instant Hard Cache Purge & Service Worker Reset -->
    <script>
      (function() {
        var APP_CURRENT_VER = '__APP_VERSION__';
        var storedVer = localStorage.getItem('deliveree_app_build_version');
        if (storedVer !== APP_CURRENT_VER) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
              }
            }).catch(function() {});
          }
          if (typeof window !== 'undefined' && 'caches' in window) {
            caches.keys().then(function(keys) {
              keys.forEach(function(key) {
                caches.delete(key);
              });
            }).catch(function() {});
          }
          localStorage.setItem('deliveree_app_build_version', APP_CURRENT_VER);
          // Cache version synchronized cleanly without abrupt reload
        }
      })();
    </script>

    <!-- PWA & Mobile Installation Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Deliveree" />
    <link rel="apple-touch-icon" href="/icons/app-icon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Deliveree - Smart Package & Shipment Tracker</title>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased selection:bg-blue-500/30 selection:text-blue-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
