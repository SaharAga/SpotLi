name: Pre-Submit CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  require-version-bump:
    name: Require Version Bump
    runs-on: ubuntu-latest
    # Only meaningful for a PR diff against its base — a push to main is the
    # merge itself, already covered by the PR that produced it.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check package.json version changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          BASE_VERSION=$(git show "origin/$BASE_REF:package.json" | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0,"utf8")).version)')
          HEAD_VERSION=$(node -e 'process.stdout.write(require("./package.json").version)')
          CHANGED_SRC=$(git diff --name-only "origin/$BASE_REF...HEAD" -- src/ | wc -l | tr -d ' ')
          echo "Base ($BASE_REF): $BASE_VERSION"
          echo "Head: $HEAD_VERSION"
          echo "Changed src/ files: $CHANGED_SRC"
          if [ "$CHANGED_SRC" -gt 0 ] && [ "$BASE_VERSION" = "$HEAD_VERSION" ]; then
            echo "::error::This PR changes src/** but package.json's version ($HEAD_VERSION) is unchanged from $BASE_REF. Bump package.json's \"version\" field — src/constants/version.js and index.html now derive from it automatically. See CHANGELOG.md for the MAJOR.MINOR.PATCH convention."
            exit 1
          fi
          echo "OK — version bumped ($BASE_VERSION -> $HEAD_VERSION), or no src/ changes in this PR."

  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

  test:
    name: Automated Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm run test

  functions:
    name: Cloud Functions Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      # --legacy-peer-deps works around an npm 10 arborist crash resolving
      # vitest's optional peer graph (unrelated to this project's own deps);
      # revisit once npm ships a fix.
      - name: Install Dependencies
        working-directory: functions
        run: npm ci --legacy-peer-deps

      - name: Run Linter
        working-directory: functions
        run: npm run lint

      - name: Run Test Suite
        working-directory: functions
        run: npm run test

  build:
    name: Production Build Verification
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Public Firebase client identifiers, supplied as repository variables so
      # they live in exactly one place and never in a committed file (see
      # scripts/pre_commit_secrets_check.js). The build fails loudly if unset.
      - name: Build Application
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          # Optional: enables Firebase App Check when set. See README.md
          # "Abuse protection (App Check)". Unset is fine — App Check just
          # never initializes.
          VITE_RECAPTCHA_V3_SITE_KEY: ${{ vars.VITE_RECAPTCHA_V3_SITE_KEY }}

      - name: Upload build output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy-firebase:
    name: Deploy to Firebase Hosting (production)
    runs-on: ubuntu-latest
    needs: [build]
    # Skips cleanly (instead of failing CI) until FIREBASE_SERVICE_ACCOUNT_DELIVEREE is added as a repo secret.
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.FIREBASE_HOSTING_ENABLED == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Download build output
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DELIVEREE }}'
          projectId: deliveree-app-2a938
          channelId: live

      # Hosting deploys do not touch Firestore rules, so without this step the
      # live security rules drift from firestore.rules in this repo.
      - name: Authenticate for Firestore rules deploy
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DELIVEREE }}'

      - name: Deploy Firestore rules
        run: npx --yes firebase-tools@14 deploy --only firestore:rules --project deliveree-app-2a938 --non-interactive
