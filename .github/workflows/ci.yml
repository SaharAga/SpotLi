name: Pre-Submit CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  require-change-declaration:
    name: Require Change Declaration
    runs-on: ubuntu-latest
    # Only meaningful for a PR diff against its base — a push to main is the
    # merge itself, already covered by the PR that produced it.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A PR that changes shipped code must declare the change, satisfied
      # EITHER by adding a `.changes/*.md` changeset (preferred — new files
      # never conflict between parallel PRs) OR by bumping package.json
      # directly. Requiring a bump in every PR made the version a PR counter
      # and guaranteed a four-file conflict in every sibling PR each time one
      # merged. See .changes/README.md.
      #
      # "Shipped code" deliberately includes functions/ and firestore.rules,
      # not just src/ — both change deployed behaviour and neither was covered
      # by the previous src/-only check.
      - name: Check the PR declares its change
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          BASE_VERSION=$(git show "origin/$BASE_REF:package.json" | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0,"utf8")).version)')
          HEAD_VERSION=$(node -e 'process.stdout.write(require("./package.json").version)')
          CHANGED_SHIPPED=$(git diff --name-only "origin/$BASE_REF...HEAD" -- src/ functions/ firestore.rules | wc -l | tr -d ' ')
          NEW_CHANGESETS=$(git diff --name-only --diff-filter=A "origin/$BASE_REF...HEAD" -- .changes/ | grep -v 'README.md' | wc -l | tr -d ' ')

          echo "Base ($BASE_REF): $BASE_VERSION"
          echo "Head:             $HEAD_VERSION"
          echo "Changed shipped files: $CHANGED_SHIPPED"
          echo "New changesets:        $NEW_CHANGESETS"

          # When a bump IS present it must move forwards. The previous check
          # tested only inequality, so a PR carrying a version lower than its
          # base passed and silently regressed main on merge — which happened
          # once, with pre-allocated versions merged out of order.
          if [ "$BASE_VERSION" != "$HEAD_VERSION" ]; then
            # From any version exactly three successors are legal: patch, minor,
            # major. Merely "larger" is not enough — 0.6.4 -> 0.9.0 skips minors
            # and leaves a gap that means nothing. scripts/version-utils.mjs is
            # the single source of this rule, shared with `npm run release`.
            if ! node -e '
              import("./scripts/version-utils.mjs").then(({ successors, bumpBetween }) => {
                const [from, to] = process.argv.slice(1);
                const bump = bumpBetween(from, to);
                if (bump) { console.log(`OK — ${from} -> ${to} (${bump}).`); process.exit(0); }
                const legal = successors(from);
                console.error(`::error::package.json version ${to} is not a legal successor of ${from}. Valid next versions: ${legal.patch} (patch), ${legal.minor} (minor), ${legal.major} (major).`);
                process.exit(1);
              }).catch((e) => { console.error(`::error::${e.message}`); process.exit(1); });
            ' "$BASE_VERSION" "$HEAD_VERSION"; then
              exit 1
            fi
            exit 0
          fi

          if [ "$NEW_CHANGESETS" -gt 0 ]; then
            echo "OK — change declared via changeset."
            exit 0
          fi

          if [ "$CHANGED_SHIPPED" -gt 0 ]; then
            echo "::error::This PR changes shipped code (src/, functions/ or firestore.rules) but declares no change. Add a changeset under .changes/ (see .changes/README.md) or bump package.json's version."
            exit 1
          fi

          echo "OK — no shipped-code changes in this PR."

  # A release commit (produced by `npm run release`) only ever touches
  # package.json, CHANGELOG.md, and .changes/ — it carries no code the PR
  # that preceded it didn't already carry, and that PR already ran the full
  # suite below against this exact code. Re-running lint/test/functions on
  # the release push is pure duplication (and doubles CI time on every
  # release); skip them there and rely on the PR's already-green run. Any
  # push whose diff touches anything else still runs everything, same as a
  # PR does.
  detect-release-only-commit:
    name: Detect Release-Only Commit
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      release_only: ${{ steps.check.outputs.release_only }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            echo "No usable before-SHA (first push or force-push) — treating as not release-only."
            echo "release_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BEFORE_SHA" HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          NON_RELEASE=$(echo "$CHANGED" | grep -vE '^(package\.json|CHANGELOG\.md|\.changes/)' | grep -c '.' || true)

          if [ -n "$CHANGED" ] && [ "$NON_RELEASE" -eq 0 ]; then
            echo "release_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_only=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    needs: [detect-release-only-commit]
    if: |
      always() &&
      (needs.detect-release-only-commit.result == 'skipped' || needs.detect-release-only-commit.outputs.release_only != 'true')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

  test:
    name: Automated Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [detect-release-only-commit]
    if: |
      always() &&
      (needs.detect-release-only-commit.result == 'skipped' || needs.detect-release-only-commit.outputs.release_only != 'true')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm run test

  functions:
    name: Cloud Functions Lint & Tests
    runs-on: ubuntu-latest
    needs: [detect-release-only-commit]
    if: |
      always() &&
      (needs.detect-release-only-commit.result == 'skipped' || needs.detect-release-only-commit.outputs.release_only != 'true')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      # --legacy-peer-deps works around an npm 10 arborist crash resolving
      # vitest's optional peer graph (unrelated to this project's own deps);
      # revisit once npm ships a fix.
      - name: Install Dependencies
        working-directory: functions
        run: npm ci --legacy-peer-deps

      - name: Run Linter
        working-directory: functions
        run: npm run lint

      - name: Run Test Suite
        working-directory: functions
        run: npm run test

  build:
    name: Production Build Verification
    runs-on: ubuntu-latest
    needs: [lint, test]
    # lint/test are skipped (not failed) on a release-only commit — this
    # still needs to run there to produce the deploy artifact. Only actual
    # failures should block it.
    if: |
      always() &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Public Firebase client identifiers, supplied as repository variables so
      # they live in exactly one place and never in a committed file (see
      # scripts/pre_commit_secrets_check.js). The build fails loudly if unset.
      - name: Build Application
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          # Optional: enables Firebase App Check when set. See README.md
          # "Abuse protection (App Check)". Unset is fine — App Check just
          # never initializes.
          VITE_RECAPTCHA_V3_SITE_KEY: ${{ vars.VITE_RECAPTCHA_V3_SITE_KEY }}
          # Optional: enables Web Push subscription when set (public VAPID
          # key, not sensitive). See README.md "Automated Email Ingestion &
          # Gmail Sync". Unset is fine — push subscription just never
          # attempts to register.
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}

      # include-hidden-files is required — actions/upload-artifact@v4 silently
      # drops dotfiles/dot-directories otherwise, which dropped
      # public/.well-known/ (and anything else dot-prefixed) from every
      # artifact this job ever produced, independent of firebase.json's ignore
      # config being correct.
      - name: Upload build output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1
          include-hidden-files: true

  # A merge to main is not a release. Deploying every merge meant several
  # deploys could share one version, so "I'm on 0.15.12" stopped identifying a
  # build — the exact property the version gate exists to protect. Deploy now
  # happens only on the commit that changes package.json's version, i.e. the
  # release commit produced by `npm run release`.
  detect-release:
    name: Detect Release Commit
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          HEAD_VERSION=$(node -e 'process.stdout.write(require("./package.json").version)')
          
          # Check previous version from the commit before this push, falling back to HEAD~1
          PREV_VERSION=""
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            PREV_VERSION=$(git show "$BEFORE_SHA:package.json" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))' || echo "")
          fi
          if [ -z "$PREV_VERSION" ]; then
            PREV_VERSION=$(git show HEAD~1:package.json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))' || echo "")
          fi

          echo "version=$HEAD_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$HEAD_VERSION" != "$PREV_VERSION" ]; then
            echo "Release commit: $PREV_VERSION -> $HEAD_VERSION"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not a release commit (version unchanged at $HEAD_VERSION) — skipping deploy."
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-firebase:
    name: Deploy to Firebase Hosting (production)
    runs-on: ubuntu-latest
    needs: [build, detect-release]
    # Skips cleanly (instead of failing CI) until FIREBASE_SERVICE_ACCOUNT_DELIVEREE is added as a repo secret.
    # always() + an explicit build-result check: GitHub's implicit success()
    # walks the whole transitive dependency chain, not just direct needs —
    # since build depends on lint/test, which are legitimately *skipped* (not
    # failed) on a release-only commit, the implicit success() this if would
    # otherwise get silently broke and skipped every release deploy.
    if: |
      always() && needs.build.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.detect-release.outputs.is_release == 'true' &&
      vars.FIREBASE_HOSTING_ENABLED == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DELIVEREE }}'
          projectId: deliveree-app-2a938
          channelId: live

      # Hosting deploys do not touch Firestore rules, so without this step the
      # live security rules drift from firestore.rules in this repo.
      - name: Authenticate for Firestore rules deploy
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DELIVEREE }}'

      - name: Deploy Firestore rules
        run: npx --yes firebase-tools@14 deploy --only firestore:rules --project deliveree-app-2a938 --non-interactive

  deploy-functions:
    name: Deploy Cloud Functions
    runs-on: ubuntu-latest
    needs: [functions, detect-release-only-commit]
    # Cloud Functions have no staging/production split (one live function
    # set per Firebase project, unlike Hosting's channels) — deploy on every
    # ordinary merge to main, same trigger as deploy-staging below, so a
    # functions/ fix goes live as soon as it merges rather than waiting on
    # the next version-bump release.
    if: |
      always() && needs.functions.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.detect-release-only-commit.outputs.release_only != 'true' &&
      vars.FIREBASE_HOSTING_ENABLED == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Dependencies
        working-directory: functions
        run: npm ci --legacy-peer-deps

      - name: Authenticate for Functions deploy
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DELIVEREE }}'

      # firebase.json's predeploy hooks re-run lint/test from functions/ as
      # a final gate immediately before deploy, on top of the `functions`
      # job above already having done so.
      - name: Deploy Cloud Functions
        # --force auto-accepts setting up the Artifact Registry cleanup
        # policy for container images on first deploy, which otherwise
        # fails non-interactively (it's a confirmation prompt with no
        # non-interactive default).
        run: npx --yes firebase-tools@14 deploy --only functions --project deliveree-app-2a938 --non-interactive --force

  deploy-staging:
    name: Deploy to Firebase Hosting (staging)
    runs-on: ubuntu-latest
    needs: [build, detect-release-only-commit]
    # Deploys on every ordinary merge to main, for pre-release visibility —
    # EXCEPT on a release-only commit, which carries no code the preceding
    # merge didn't already carry and deploy to staging; redeploying the same
    # code there is pure duplication right before the production deploy below
    # (which stays gated on is_release in deploy-firebase).
    # always() + an explicit build-result check: GitHub's implicit success()
    # walks the whole transitive dependency chain, and lint/test being
    # legitimately skipped on a release-only commit broke it silently
    # without this — see deploy-firebase above.
    if: |
      always() && needs.build.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.detect-release-only-commit.outputs.release_only != 'true' &&
      vars.FIREBASE_HOSTING_ENABLED == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Firebase Hosting (staging channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DELIVEREE }}'
          projectId: deliveree-app-2a938
          channelId: staging

      - name: Authenticate for Firestore rules deploy
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DELIVEREE }}'

      - name: Deploy Firestore rules
        run: npx --yes firebase-tools@14 deploy --only firestore:rules --project deliveree-app-2a938 --non-interactive

