name: Pre-Submit CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  require-change-declaration:
    name: Require Change Declaration
    runs-on: ubuntu-latest
    # Only meaningful for a PR diff against its base — a push to main is the
    # merge itself, already covered by the PR that produced it.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A PR that changes shipped code must declare the change, satisfied
      # EITHER by adding a `.changes/*.md` changeset (preferred — new files
      # never conflict between parallel PRs) OR by bumping package.json
      # directly. Requiring a bump in every PR made the version a PR counter
      # and guaranteed a four-file conflict in every sibling PR each time one
      # merged. See .changes/README.md.
      #
      # "Shipped code" deliberately includes functions/ and firestore.rules,
      # not just src/ — both change deployed behaviour and neither was covered
      # by the previous src/-only check.
      - name: Check the PR declares its change
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          BASE_VERSION=$(git show "origin/$BASE_REF:package.json" | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0,"utf8")).version)')
          HEAD_VERSION=$(node -e 'process.stdout.write(require("./package.json").version)')
          CHANGED_SHIPPED=$(git diff --name-only "origin/$BASE_REF...HEAD" -- src/ functions/ firestore.rules | wc -l | tr -d ' ')
          NEW_CHANGESETS=$(git diff --name-only --diff-filter=A "origin/$BASE_REF...HEAD" -- .changes/ | grep -v 'README.md' | wc -l | tr -d ' ')

          echo "Base ($BASE_REF): $BASE_VERSION"
          echo "Head:             $HEAD_VERSION"
          echo "Changed shipped files: $CHANGED_SHIPPED"
          echo "New changesets:        $NEW_CHANGESETS"

          # When a bump IS present it must move forwards. The previous check
          # tested only inequality, so a PR carrying a version lower than its
          # base passed and silently regressed main on merge — which happened
          # once, with pre-allocated versions merged out of order.
          if [ "$BASE_VERSION" != "$HEAD_VERSION" ]; then
            # From any version exactly three successors are legal: patch, minor,
            # major. Merely "larger" is not enough — 0.6.4 -> 0.9.0 skips minors
            # and leaves a gap that means nothing. scripts/version-utils.mjs is
            # the single source of this rule, shared with `npm run release`.
            if ! node -e '
              import("./scripts/version-utils.mjs").then(({ successors, bumpBetween }) => {
                const [from, to] = process.argv.slice(1);
                const bump = bumpBetween(from, to);
                if (bump) { console.log(`OK — ${from} -> ${to} (${bump}).`); process.exit(0); }
                const legal = successors(from);
                console.error(`::error::package.json version ${to} is not a legal successor of ${from}. Valid next versions: ${legal.patch} (patch), ${legal.minor} (minor), ${legal.major} (major).`);
                process.exit(1);
              }).catch((e) => { console.error(`::error::${e.message}`); process.exit(1); });
            ' "$BASE_VERSION" "$HEAD_VERSION"; then
              exit 1
            fi
            exit 0
          fi

          if [ "$NEW_CHANGESETS" -gt 0 ]; then
            echo "OK — change declared via changeset."
            exit 0
          fi

          if [ "$CHANGED_SHIPPED" -gt 0 ]; then
            echo "::error::This PR changes shipped code (src/, functions/ or firestore.rules) but declares no change. Add a changeset under .changes/ (see .changes/README.md) or bump package.json's version."
            exit 1
          fi

          echo "OK — no shipped-code changes in this PR."

  # Most PRs touch no Cloud Functions code, yet the functions lint/test job
  # (7m) and the functions deploy (11m) ran in full on every one of them —
  # together the largest single block of wasted CI time in this pipeline.
  # Same story for `firestore.rules`, whose deploy step costs ~7m and only
  # matters when the file actually changed.
  #
  # The same reasoning covers the `code` output below, which skips lint and
  # the test suite on a diff of pure documentation.
  #
  # All three outputs FAIL OPEN: any situation where a real diff cannot be
  # computed (first push, force-push, shallow fetch, an unexpected event)
  # reports `true` and runs everything. A detection bug must never silently
  # skip a deploy — the failure mode of running too much is a slow pipeline,
  # the failure mode of running too little is functions or rules silently
  # not shipping, or untested code reaching main.
  # One job answers every "should the rest of this run?" question. These were
  # three separate jobs (Detect Changed Areas / Detect Release Commit / Detect
  # Release-Only Commit), each doing its own full-history checkout for a few
  # seconds of git and shell. Actions bills per job rounded up to the whole
  # minute, so three near-instant jobs cost three minutes of the allowance on
  # every push while doing well under one minute of work.
  detect:
    name: Detect Changes & Release State
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.check.outputs.functions }}
      rules: ${{ steps.check.outputs.rules }}
      code: ${{ steps.check.outputs.code }}
      release_only: ${{ steps.check.outputs.release_only }}
      is_release: ${{ steps.check.outputs.is_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          REF: ${{ github.ref }}
        run: |
          # Defaults are the safe answers: run every job, deploy nothing. Each
          # is narrowed below only once the diff is known to be trustworthy,
          # so any unexpected state (first push, force-push, unreachable base)
          # errs toward running too much rather than skipping a real check.
          FUNCTIONS=true
          RULES=true
          CODE=true
          RELEASE_ONLY=false
          IS_RELEASE=false

          CHANGED=""
          DIFF_OK=false
          if [ "$EVENT" = "pull_request" ]; then
            if git fetch origin "$BASE_REF" --depth=1 && CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD"); then
              DIFF_OK=true
            else
              echo "Could not diff against $BASE_REF — running every job."
            fi
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            if CHANGED=$(git diff --name-only "$BEFORE_SHA" HEAD); then
              DIFF_OK=true
            else
              echo "Could not diff against $BEFORE_SHA — running every job."
            fi
          else
            echo "No usable before-SHA (first push or force-push) — running every job."
          fi

          if [ "$DIFF_OK" = true ]; then
            echo "Changed files:"
            echo "$CHANGED"

            echo "$CHANGED" | grep -qE '^functions/' && FUNCTIONS=true || FUNCTIONS=false
            # Indexes ride with the rules: both are Firestore config deployed
            # by the same step, and the 17TRACK webhook's collection-group
            # lookup depends on firestore.indexes.json being live.
            echo "$CHANGED" | grep -qE '^firestore\.(rules|indexes\.json)$' && RULES=true || RULES=false

            # A diff of nothing but prose cannot change what oxlint or vitest
            # sees, yet lint and the test suite ran in full on every docs PR
            # and again on its merge commit. Markdown anywhere counts as
            # prose, `docs/` included, and so do `.changes/*.md` changesets: a
            # changeset declares a version bump, it ships no code, and
            # require-change-declaration inspects it independently of this.
            #
            # Everything else is code, deliberately — .github/workflows/ most
            # of all, since a workflow edit is exactly when the full suite
            # should run.
            NON_DOC=$(echo "$CHANGED" | grep -vE '(\.md$|^docs/|^LICENSE$)' | grep -c '.' || true)
            if [ -n "$CHANGED" ] && [ "$NON_DOC" -eq 0 ]; then
              echo "Documentation-only diff — skipping lint and tests."
              CODE=false
            fi

            # A release commit (produced by `npm run release`) only ever
            # touches package.json, package-lock.json, CHANGELOG.md and
            # .changes/ — it carries no code that was not already on main and
            # already tested by the PR that put it there. Re-running lint and
            # the full suite against it proves nothing.
            #
            # This is evaluated for pull_request as well as push. It used to be
            # push-only, which meant every release *PR* ran the whole suite
            # against a version bump — the exact duplication the push side
            # already refused, paid on every release.
            #
            # package-lock.json is in the list because `npm run release` bumps
            # the lockfile's own version alongside package.json's (0.31.1).
            # Before that the lock drifted — it sat at 0.16.0 for fourteen
            # releases — and once the script started touching it, every release
            # commit named a file this pattern did not, so nothing counted as
            # release-only and the skip quietly stopped working.
            #
            # The bet: anything reaching main arrives through a PR, and a PR
            # whose diff is more than these four things runs everything. What
            # it does not cover is a direct push to main, which was already
            # true before this job was consolidated.
            NON_RELEASE=$(echo "$CHANGED" | grep -vE '^(package\.json|package-lock\.json|CHANGELOG\.md|\.changes/)' | grep -c '.' || true)
            if [ -n "$CHANGED" ] && [ "$NON_RELEASE" -eq 0 ]; then
              RELEASE_ONLY=true
            fi
          fi

          # A merge to main is not a release. Deploying every merge meant
          # several deploys could share one version, so "I'm on 0.15.12"
          # stopped identifying a build — the exact property the version gate
          # exists to protect. Deploy happens only on the commit that changes
          # package.json's version, i.e. the release commit.
          VERSION=$(node -e 'process.stdout.write(require("./package.json").version)')
          if [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            PREV_VERSION=""
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
              PREV_VERSION=$(git show "$BEFORE_SHA:package.json" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))' || echo "")
            fi
            if [ -z "$PREV_VERSION" ]; then
              PREV_VERSION=$(git show HEAD~1:package.json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))' || echo "")
            fi
            if [ "$VERSION" != "$PREV_VERSION" ]; then
              echo "Release commit: $PREV_VERSION -> $VERSION"
              IS_RELEASE=true
            else
              echo "Not a release commit (version unchanged at $VERSION) — skipping deploy."
            fi
          fi

          echo "functions=$FUNCTIONS" >> "$GITHUB_OUTPUT"
          echo "rules=$RULES" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "release_only=$RELEASE_ONLY" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # Lint used to be its own job. It runs in about a second, but a job is
  # billed as a whole minute and pays for its own checkout, Node setup and
  # dependency restore first — so it cost roughly as much as the test suite it
  # ran beside, for 1/150th of the work. It shares this job's dependency tree
  # and runs before the suite, so a lint error still reports in seconds.
  test:
    name: Lint, Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [detect]
    # always() + `!= 'false'` rather than `== 'true'`: a detect that fails
    # outright leaves both outputs empty, and neither empty value matches, so
    # the suite still runs. Losing the detector must never silently cost the
    # tests.
    if: |
      always() &&
      needs.detect.outputs.release_only != 'true' &&
      needs.detect.outputs.code != 'false'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # `cache: 'npm'` above only caches the download tarballs in ~/.npm —
      # `npm ci` still wipes and relinks node_modules from scratch every run,
      # which measured 124-423s per job across this pipeline against 2-110s of
      # actual work. Caching node_modules itself skips that entirely on a hit.
      # The key pins OS and Node major alongside the lockfile hash, so a
      # runner or engine change can never restore a tree built for another.
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install Dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Test Suite
        run: npm run test

  functions:
    name: Cloud Functions Lint & Tests
    runs-on: ubuntu-latest
    needs: [detect]
    if: |
      always() &&
      needs.detect.outputs.release_only != 'true' &&
      needs.detect.outputs.functions == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      # --legacy-peer-deps works around an npm 10 arborist crash resolving
      # vitest's optional peer graph (unrelated to this project's own deps);
      # revisit once npm ships a fix.
      # Same reasoning as the root jobs — see "Cache node_modules" there.
      # functions/ install measured 422-423s against 7s of lint+test.
      - name: Cache functions node_modules
        id: functions-node-modules
        uses: actions/cache@v4
        with:
          path: functions/node_modules
          key: functions-node-modules-${{ runner.os }}-node22-${{ hashFiles('functions/package-lock.json') }}

      - name: Install Dependencies
        if: steps.functions-node-modules.outputs.cache-hit != 'true'
        working-directory: functions
        run: npm ci --legacy-peer-deps

      - name: Run Linter
        working-directory: functions
        run: npm run lint

      - name: Run Test Suite
        working-directory: functions
        run: npm run test

  build:
    name: Production Build Verification
    runs-on: ubuntu-latest
    needs: [test]
    # test is skipped (not failed) on a release-only commit — this
    # still needs to run there to produce the deploy artifact. Only actual
    # failures should block it. The same now applies to a documentation-only
    # diff, where they skip for a different reason (detect's `code`
    # output); this job is deliberately NOT gated on that too. deploy-staging
    # requires `needs.build.result == 'success'` on every ordinary merge to
    # main, so skipping the build here would silently stop staging deploying
    # a docs merge — and at ~13s of work behind a warm node_modules cache,
    # one billable minute is not worth that coupling.
    if: |
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # `cache: 'npm'` above only caches the download tarballs in ~/.npm —
      # `npm ci` still wipes and relinks node_modules from scratch every run,
      # which measured 124-423s per job across this pipeline against 2-110s of
      # actual work. Caching node_modules itself skips that entirely on a hit.
      # The key pins OS and Node major alongside the lockfile hash, so a
      # runner or engine change can never restore a tree built for another.
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install Dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Public Firebase client identifiers, supplied as repository variables so
      # they live in exactly one place and never in a committed file (see
      # scripts/pre_commit_secrets_check.js). The build fails loudly if unset.
      - name: Build Application
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          # Optional: enables Firebase App Check when set. See README.md
          # "Abuse protection (App Check)". Unset is fine — App Check just
          # never initializes.
          VITE_RECAPTCHA_V3_SITE_KEY: ${{ vars.VITE_RECAPTCHA_V3_SITE_KEY }}
          # Optional: enables Web Push subscription when set (public VAPID
          # key, not sensitive). See README.md "Automated Email Ingestion &
          # Gmail Sync". Unset is fine — push subscription just never
          # attempts to register.
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}

      # include-hidden-files is required — actions/upload-artifact@v4 silently
      # drops dotfiles/dot-directories otherwise, which dropped
      # public/.well-known/ (and anything else dot-prefixed) from every
      # artifact this job ever produced, independent of firebase.json's ignore
      # config being correct.
      - name: Upload build output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1
          include-hidden-files: true

  deploy-firebase:
    name: Deploy to Firebase Hosting (production)
    runs-on: ubuntu-latest
    needs: [build, detect]
    # Skips cleanly (instead of failing CI) until FIREBASE_SERVICE_ACCOUNT_DELIVEREE is added as a repo secret.
    # always() + an explicit build-result check: GitHub's implicit success()
    # walks the whole transitive dependency chain, not just direct needs —
    # since build depends on test, which is legitimately *skipped* (not
    # failed) on a release-only commit, the implicit success() this if would
    # otherwise get silently broke and skipped every release deploy.
    if: |
      always() && needs.build.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.detect.outputs.is_release == 'true' &&
      vars.FIREBASE_HOSTING_ENABLED == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # These two steps exist purely for speed. Without them each
      # `npx --yes firebase-tools@14` below re-downloaded the entire
      # toolchain on a cold cache — 451s for the hosting deploy and a further
      # 448s for the rules deploy, in the same job.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache firebase-tools
        uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: npx-firebase-tools-14-${{ runner.os }}

      # Same swap as the staging job — see the note there. `hosting:deploy`
      # publishes to the live channel, which is what channelId: live meant.
      - name: Authenticate for Firebase deploys
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DELIVEREE }}'

      - name: Deploy to Firebase Hosting
        run: |
          npx --yes firebase-tools@14 deploy --only hosting \
            --project deliveree-app-2a938 --non-interactive

      # Hosting deploys do not touch Firestore rules, so without this step the
      # live security rules drift from firestore.rules in this repo.
      # Skipped when firestore.rules is unchanged. Hosting deploys never touch
      # Firestore rules, so this step has to exist — but redeploying an
      # identical file cost ~7.5 minutes on every single merge. Note staging
      # and production share ONE Firebase project, so rules pushed by the
      # staging deploy at merge time are already live by the time a release
      # reaches production; there is no second environment to sync.
      # .github/workflows/health-check.yml verifies daily that the deployed
      # rules still match the repo, which is the backstop if this is ever
      # skipped when it should not have been.
      - name: Deploy Firestore rules and indexes
        if: needs.detect.outputs.rules == 'true'
        run: npx --yes firebase-tools@14 deploy --only firestore:rules,firestore:indexes --project deliveree-app-2a938 --non-interactive

  deploy-functions:
    name: Deploy Cloud Functions
    runs-on: ubuntu-latest
    needs: [functions, detect]
    # Cloud Functions have no staging/production split (one live function
    # set per Firebase project, unlike Hosting's channels) — deploy on every
    # ordinary merge to main that TOUCHES functions/, so a functions/ fix goes
    # live as soon as it merges rather than waiting on the next version-bump
    # release. A merge that touches no functions/ file would redeploy byte
    # identical code, so it is skipped (see detect).
    if: |
      always() && needs.functions.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.detect.outputs.release_only != 'true' &&
      needs.detect.outputs.functions == 'true' &&
      vars.FIREBASE_HOSTING_ENABLED == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      # Same reasoning as the root jobs — see "Cache node_modules" there.
      # functions/ install measured 422-423s against 7s of lint+test.
      - name: Cache functions node_modules
        id: functions-node-modules
        uses: actions/cache@v4
        with:
          path: functions/node_modules
          key: functions-node-modules-${{ runner.os }}-node22-${{ hashFiles('functions/package-lock.json') }}

      - name: Install Dependencies
        if: steps.functions-node-modules.outputs.cache-hit != 'true'
        working-directory: functions
        run: npm ci --legacy-peer-deps

      - name: Authenticate for Functions deploy
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DELIVEREE }}'

      # firebase.json's predeploy hooks re-run lint/test from functions/ as
      # a final gate immediately before deploy, on top of the `functions`
      # job above already having done so.
      - name: Deploy Cloud Functions
        # --force auto-accepts setting up the Artifact Registry cleanup
        # policy for container images on first deploy, which otherwise
        # fails non-interactively (it's a confirmation prompt with no
        # non-interactive default).
        run: npx --yes firebase-tools@14 deploy --only functions --project deliveree-app-2a938 --non-interactive --force

  deploy-staging:
    name: Deploy to Firebase Hosting (staging)
    runs-on: ubuntu-latest
    needs: [build, detect]
    # Deploys on every ordinary merge to main, for pre-release visibility —
    # EXCEPT on a release-only commit, which carries no code the preceding
    # merge didn't already carry and deploy to staging; redeploying the same
    # code there is pure duplication right before the production deploy below
    # (which stays gated on is_release in deploy-firebase).
    # always() + an explicit build-result check: GitHub's implicit success()
    # walks the whole transitive dependency chain, and test being
    # legitimately skipped on a release-only commit broke it silently
    # without this — see deploy-firebase above.
    if: |
      always() && needs.build.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.detect.outputs.release_only != 'true' &&
      vars.FIREBASE_HOSTING_ENABLED == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # These two steps exist purely for speed. Without them each
      # `npx --yes firebase-tools@14` below re-downloaded the entire
      # toolchain on a cold cache — 451s for the hosting deploy and a further
      # 448s for the rules deploy, in the same job.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache firebase-tools
        uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: npx-firebase-tools-14-${{ runner.os }}

      # Was FirebaseExtended/action-hosting-deploy@v0, which shells out to
      # `npx firebase-tools@latest` internally — a cold ~450s install on every
      # run that no cache of ours could hit (we pin @14, it resolved 15.29.0),
      # and a deploy toolchain whose version drifted silently whenever npm
      # published. Calling the CLI directly makes the version explicit and lets
      # the ~/.npm/_npx cache above actually apply.
      - name: Authenticate for Firebase deploys
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DELIVEREE }}'

      - name: Deploy to Firebase Hosting (staging channel)
        run: |
          npx --yes firebase-tools@14 hosting:channel:deploy staging \
            --expires 7d --project deliveree-app-2a938 --non-interactive

      # Skipped when firestore.rules is unchanged. Hosting deploys never touch
      # Firestore rules, so this step has to exist — but redeploying an
      # identical file cost ~7.5 minutes on every single merge. Note staging
      # and production share ONE Firebase project, so rules pushed by the
      # staging deploy at merge time are already live by the time a release
      # reaches production; there is no second environment to sync.
      # .github/workflows/health-check.yml verifies daily that the deployed
      # rules still match the repo, which is the backstop if this is ever
      # skipped when it should not have been.
      - name: Deploy Firestore rules and indexes
        if: needs.detect.outputs.rules == 'true'
        run: npx --yes firebase-tools@14 deploy --only firestore:rules,firestore:indexes --project deliveree-app-2a938 --non-interactive

